syntax = "proto3";

package ops.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

import "pagination/v1/pagination.proto";

// TerminalService Web 终端双向通道:
// 浏览器 WS ↔ admin BFF ↔ 本服务(gRPC bidi 流) ↔ MQTT ↔ agent。
// 首帧必须为 event=OPEN 携带 agent_id,此后 data 帧双向对传;
// 会话开关经 command 主题(terminal_open/terminal_close,入指令台账审计)。
service TerminalService {
  // 查询终端会话审计列表
  rpc ListTerminalSessions (pagination.PagingRequest) returns (ListTerminalSessionResponse) {}

  // 查询终端会话详情
  rpc GetTerminalSession (GetTerminalSessionRequest) returns (TerminalSession) {}

  // 拉取会话录制分块(回放用,按 seq 升序)
  rpc ListTerminalChunks (ListTerminalChunksRequest) returns (ListTerminalChunkResponse) {}

  // 终端字节流通道
  rpc Channel (stream TerminalChunk) returns (stream TerminalChunk) {}
}

// 终端数据块
message TerminalChunk {
  optional string agent_id = 1 [
    json_name = "agentId"
  ]; // 机器唯一标识(仅首帧必填)

  optional string session_id = 2 [
    json_name = "sessionId"
  ]; // 会话ID(仅首帧必填;后续帧可不带)

  optional bytes data = 3 [
    json_name = "data"
  ]; // 字节流(输入/输出)

  optional string event = 4 [
    json_name = "event"
  ]; // 控制事件: OPEN=发起(首帧) OPENED=会话就绪 CLOSED=会话结束 RESIZE=调整PTY尺寸

  optional string error = 5 [
    json_name = "error"
  ]; // 错误信息(伴随 CLOSED/ERROR)

  optional uint32 cols = 6 [
    json_name = "cols"
  ]; // 终端列数(伴随 RESIZE)

  optional uint32 rows = 7 [
    json_name = "rows"
  ]; // 终端行数(伴随 RESIZE)
}

// 终端会话审计记录
message TerminalSession {
  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OUTPUT_ONLY
  ]; // 记录ID

  optional string session_id = 2 [json_name = "sessionId"]; // 会话 ID

  optional uint32 node_id = 3 [json_name = "nodeId"]; // 节点

  optional string agent_id = 4 [json_name = "agentId"]; // 机器标识

  optional uint32 operator_id = 5 [json_name = "operatorId"]; // 打开人

  optional string status = 6 [json_name = "status"]; // 状态(OPEN/CLOSED)

  optional int64 input_bytes = 7 [json_name = "inputBytes"]; // 录制输入字节

  optional int64 output_bytes = 8 [json_name = "outputBytes"]; // 录制输出字节

  optional int32 chunk_count = 9 [json_name = "chunkCount"]; // 分块数

  optional bool truncated = 10 [json_name = "truncated"]; // 是否截断

  optional google.protobuf.Timestamp closed_at = 11 [
    json_name = "closedAt",
    (google.api.field_behavior) = OUTPUT_ONLY
  ]; // 关闭时间

  optional google.protobuf.Timestamp created_at = 30 [
    json_name = "createdAt",
    (google.api.field_behavior) = OUTPUT_ONLY
  ]; // 打开时间
}

message ListTerminalSessionResponse {
  uint64 total = 1 [json_name = "total"]; // 总数
  repeated TerminalSession items = 2 [json_name = "items"]; // 会话列表
}

message GetTerminalSessionRequest {
  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = REQUIRED
  ]; // 记录ID
}

message ListTerminalChunksRequest {
  optional uint32 session_id = 1 [
    json_name = "sessionId",
    (google.api.field_behavior) = REQUIRED
  ]; // 会话记录ID(ops_terminal_sessions.id)

  optional int32 from_seq = 2 [
    json_name = "fromSeq",
    (gnostic.openapi.v3.property) = {
      description: "起始序号(含),默认 0"
    }
  ]; // 起始序号

  optional int32 limit = 3 [
    json_name = "limit",
    (gnostic.openapi.v3.property) = {
      description: "单次上限(默认 500,上限 2000)"
    }
  ]; // 单次上限
}

message ListTerminalChunkResponse {
  repeated TerminalChunkItem items = 1 [json_name = "items"]; // 分块列表

  optional bool truncated = 2 [json_name = "truncated"]; // 是否被 limit 截断
}

message TerminalChunkItem {
  optional int32 seq = 1 [json_name = "seq"]; // 会话内序号

  optional string direction = 2 [json_name = "direction"]; // 方向(INPUT/OUTPUT)

  optional bytes payload = 3 [json_name = "payload"]; // 内容(原始字节)

  optional google.protobuf.Timestamp created_at = 4 [
    json_name = "createdAt",
    (google.api.field_behavior) = OUTPUT_ONLY
  ]; // 时间
}
