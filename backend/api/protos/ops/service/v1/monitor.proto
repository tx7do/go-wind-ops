syntax = "proto3";

package ops.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// MonitorService 监控规则管理:周期检查项目运行状态,异常时产生告警
// 并可自动重启;告警外呼 webhook 由 core 调度器执行。
service MonitorService {
  // 查询监控规则列表
  rpc ListMonitors (pagination.PagingRequest) returns (ListMonitorResponse) {}

  // 查询监控规则详情
  rpc GetMonitor (GetMonitorRequest) returns (Monitor) {}

  // 创建监控规则
  rpc CreateMonitor (CreateMonitorRequest) returns (Monitor) {}

  // 更新监控规则
  rpc UpdateMonitor (UpdateMonitorRequest) returns (google.protobuf.Empty) {}

  // 删除监控规则
  rpc DeleteMonitor (DeleteMonitorRequest) returns (google.protobuf.Empty) {}
}

// 监控规则
message Monitor {
  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OUTPUT_ONLY
  ]; // 规则ID

  optional string name = 2 [
    json_name = "name",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      description: "规则名(全局唯一)"
    }
  ]; // 规则名

  optional uint32 project_id = 3 [
    json_name = "projectId",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      description: "被监控项目ID"
    }
  ]; // 被监控项目

  optional string cron = 4 [
    json_name = "cron",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      description: "检查周期 cron 表达式(5 段标准语法)"
    }
  ]; // 检查周期

  optional bool auto_restart = 5 [
    json_name = "autoRestart",
    (gnostic.openapi.v3.property) = {
      description: "异常时自动重启项目"
    }
  ]; // 自动重启

  optional string webhook_url = 6 [
    json_name = "webhookUrl",
    (gnostic.openapi.v3.property) = {
      description: "告警通知 webhook 地址(POST JSON)"
    }
  ]; // 告警 webhook

  optional bool enabled = 7 [json_name = "enabled"]; // 是否启用

  optional string description = 8 [
    json_name = "description",
    (gnostic.openapi.v3.property) = {
      description: "描述"
    }
  ]; // 描述

  optional string target_type = 9 [
    json_name = "targetType",
    (gnostic.openapi.v3.property) = {
      description: "规则目标类型:PROJECT=项目状态 / NODE_METRIC=节点资源指标 / PROCESS=进程存在性"
    }
  ]; // 规则目标类型(PROJECT/NODE_METRIC/PROCESS)

  optional uint32 node_id = 10 [
    json_name = "nodeId",
    (gnostic.openapi.v3.property) = {
      description: "被监控节点(节点指标/进程规则必填,项目状态规则为 0)"
    }
  ]; // 被监控节点

  optional string process_name = 16 [
    json_name = "processName",
    (gnostic.openapi.v3.property) = {
      description: "被监控进程名/关键字(进程规则用;大小写不敏感包含匹配)"
    }
  ]; // 被监控进程名(进程规则用)

  optional string metric_type = 11 [
    json_name = "metricType",
    (gnostic.openapi.v3.property) = {
      description: "指标类型(节点指标规则用):CPU/MEMORY/DISK"
    }
  ]; // 指标类型(CPU/MEMORY/DISK)

  optional double threshold_percent = 12 [
    json_name = "thresholdPercent",
    (gnostic.openapi.v3.property) = {
      description: "告警阈值(百分比,指标 ≥ 阈值即命中)"
    }
  ]; // 告警阈值

  optional uint32 consecutive_count = 13 [
    json_name = "consecutiveCount",
    (gnostic.openapi.v3.property) = {
      description: "连续命中多少个检查周期才告警(防抖,默认 1)"
    }
  ]; // 连续命中次数

  optional bool notify_on_recovery = 14 [
    json_name = "notifyOnRecovery",
    (gnostic.openapi.v3.property) = {
      description: "恢复时是否产生 RECOVERY 告警并通知"
    }
  ]; // 恢复通知

  optional int32 repeat_interval_minutes = 15 [
    json_name = "repeatIntervalMinutes",
    (gnostic.openapi.v3.property) = {
      description: "重复告警最小间隔(分钟,0=每次异常检查都报)"
    }
  ]; // 重复告警间隔

  optional google.protobuf.Timestamp created_at = 30 [
    json_name = "createdAt",
    (google.api.field_behavior) = OUTPUT_ONLY
  ]; // 创建时间

  optional google.protobuf.Timestamp updated_at = 31 [
    json_name = "updatedAt",
    (google.api.field_behavior) = OUTPUT_ONLY
  ]; // 更新时间
}

message ListMonitorResponse {
  uint64 total = 1 [json_name = "total"]; // 总数
  repeated Monitor items = 2 [json_name = "items"]; // 规则列表
}

message GetMonitorRequest {
  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = REQUIRED
  ]; // 规则ID
}

message CreateMonitorRequest {
  Monitor data = 1 [
    json_name = "data",
    (google.api.field_behavior) = REQUIRED
  ]; // 规则数据
}

message UpdateMonitorRequest {
  uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = REQUIRED
  ]; // 规则ID

  Monitor data = 2 [
    json_name = "data",
    (google.api.field_behavior) = REQUIRED
  ]; // 待更新数据

  google.protobuf.FieldMask update_mask = 3 [
    json_name = "updateMask",
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表"
    }
  ]; // 要更新的字段列表
}

message DeleteMonitorRequest {
  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = REQUIRED
  ]; // 规则ID
}
