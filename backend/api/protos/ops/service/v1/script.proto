syntax = "proto3";

package ops.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// ScriptService 运维脚本管理:脚本内容集中存储在 core,执行时经 MQTT
// 下发到目标节点 agent(落地临时文件后以平台 shell 执行),输出/退出码
// 记入指令台账(CommandRecordService)。
service ScriptService {
  // 查询脚本列表
  rpc ListScripts (pagination.PagingRequest) returns (ListScriptResponse) {}

  // 查询脚本详情
  rpc GetScript (GetScriptRequest) returns (Script) {}

  // 创建脚本
  rpc CreateScript (CreateScriptRequest) returns (Script) {}

  // 更新脚本
  rpc UpdateScript (UpdateScriptRequest) returns (google.protobuf.Empty) {}

  // 删除脚本
  rpc DeleteScript (DeleteScriptRequest) returns (google.protobuf.Empty) {}

  // 在目标节点执行脚本,返回幂等 request_id;输出与退出码见指令台账
  rpc ExecuteScript (ExecuteScriptRequest) returns (ExecuteScriptResponse) {}
}

// ScriptBatchService 脚本批量执行:一次把脚本下发到多台节点,逐节点
// 生成指令台账(batch_id 关联),回执驱动批次计数与终态。
service ScriptBatchService {
  // 查询批次列表
  rpc ListScriptBatches (pagination.PagingRequest) returns (ListScriptBatchResponse) {}

  // 查询批次详情(含逐节点执行结果矩阵)
  rpc GetScriptBatch (GetScriptBatchRequest) returns (ScriptBatchDetail) {}

  // 批量执行脚本
  rpc ExecuteScriptBatch (ExecuteScriptBatchRequest) returns (ExecuteScriptBatchResponse) {}
}

// 运维脚本
message Script {
  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OUTPUT_ONLY
  ]; // 脚本ID

  optional string name = 2 [
    json_name = "name",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      description: "脚本名(全局唯一)"
    }
  ]; // 脚本名

  optional string description = 3 [
    json_name = "description",
    (gnostic.openapi.v3.property) = {
      description: "脚本描述"
    }
  ]; // 脚本描述

  optional string content = 4 [
    json_name = "content",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      description: "脚本内容(按目标节点平台 shell 语法编写)"
    }
  ]; // 脚本内容

  optional uint32 timeout_seconds = 5 [
    json_name = "timeoutSeconds",
    (gnostic.openapi.v3.property) = {
      description: "执行超时(秒,默认 60,上限 600)"
    }
  ]; // 执行超时

  repeated string labels = 6 [json_name = "labels"]; // 标签


  optional string cron = 8 [
    json_name = "cron",
    (gnostic.openapi.v3.property) = {
      description: "定时执行 cron 表达式(5 段标准语法,空为手动触发)"
    }
  ]; // 定时执行

  optional uint32 cron_node_id = 9 [
    json_name = "cronNodeId",
    (gnostic.openapi.v3.property) = {
      description: "定时执行的目标节点(0 为未配置)"
    }
  ]; // 定时执行目标节点

  optional google.protobuf.Timestamp last_cron_at = 10 [
    json_name = "lastCronAt",
    (google.api.field_behavior) = OUTPUT_ONLY
  ]; // 上次调度锚点

  optional google.protobuf.Timestamp created_at = 30 [
    json_name = "createdAt",
    (google.api.field_behavior) = OUTPUT_ONLY
  ]; // 创建时间

  optional google.protobuf.Timestamp updated_at = 31 [
    json_name = "updatedAt",
    (google.api.field_behavior) = OUTPUT_ONLY
  ]; // 更新时间
}

message ListScriptResponse {
  uint64 total = 1 [json_name = "total"]; // 总数
  repeated Script items = 2 [json_name = "items"]; // 脚本列表
}

message GetScriptRequest {
  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = REQUIRED
  ]; // 脚本ID
}

message CreateScriptRequest {
  Script data = 1 [
    json_name = "data",
    (google.api.field_behavior) = REQUIRED
  ]; // 脚本数据
}

message UpdateScriptRequest {
  uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = REQUIRED
  ]; // 脚本ID

  Script data = 2 [
    json_name = "data",
    (google.api.field_behavior) = REQUIRED
  ]; // 待更新数据

  google.protobuf.FieldMask update_mask = 3 [
    json_name = "updateMask",
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表"
    }
  ]; // 要更新的字段列表
}

message DeleteScriptRequest {
  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = REQUIRED
  ]; // 脚本ID
}

message ExecuteScriptRequest {
  uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = REQUIRED
  ]; // 脚本ID

  // 节点ID 与 agentId 二选一;同时提供时以 id 为准。
  optional uint32 node_id = 2 [
    json_name = "nodeId",
    (google.api.field_behavior) = OPTIONAL
  ]; // 目标节点ID

  optional string agent_id = 3 [
    json_name = "agentId",
    (google.api.field_behavior) = OPTIONAL
  ]; // 目标机器唯一标识

  // 危险命令确认:脚本内容命中危险模式时必须显式置 true 才放行
  // (自动化调用方——流水线/定时脚本——由服务端内部置 true)。
  optional bool confirm_dangerous = 4 [
    json_name = "confirmDangerous",
    (google.api.field_behavior) = OPTIONAL
  ]; // 危险命令已确认
}

message ExecuteScriptResponse {
  string request_id = 1 [json_name = "requestId"]; // 幂等键,结果见指令台账
}

message ExecuteScriptBatchRequest {
  optional uint32 script_id = 1 [
    json_name = "scriptId"
  ]; // 脚本ID(与 command 二选一)

  repeated uint32 node_ids = 2 [json_name = "nodeIds"]; // 目标节点ID列表(与 agent_ids 二选一)

  optional string command = 3 [
    json_name = "command"
  ]; // 即席命令内容(script_id=0 时必填,为多台机器批量执行同一条命令)

  repeated string agent_ids = 4 [json_name = "agentIds"]; // 目标机器标识列表(免 node 换算,与 node_ids 二选一)

  optional uint32 timeout_seconds = 5 [json_name = "timeoutSeconds"]; // 单台命令超时秒(仅即席命令生效,默认 60)

  // 危险命令确认:命令/脚本内容命中危险模式时必须显式置 true 才放行。
  optional bool confirm_dangerous = 6 [json_name = "confirmDangerous"]; // 危险命令已确认
}

message ExecuteScriptBatchResponse {
  optional uint32 batch_id = 1 [json_name = "batchId"]; // 批次ID

  repeated string request_ids = 2 [json_name = "requestIds"]; // 已下发节点的幂等键

  optional uint32 dispatched = 3 [json_name = "dispatched"]; // 成功下发节点数

  optional uint32 failed = 4 [json_name = "failed"]; // 下发失败节点数
}

// 脚本批量执行批次
message ScriptBatch {
  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OUTPUT_ONLY
  ]; // 批次ID

  optional uint32 script_id = 2 [
    json_name = "scriptId",
    (google.api.field_behavior) = OUTPUT_ONLY
  ]; // 脚本ID

  optional string script_name = 3 [
    json_name = "scriptName",
    (google.api.field_behavior) = OUTPUT_ONLY
  ]; // 脚本名快照

  repeated uint32 node_ids = 4 [json_name = "nodeIds"]; // 目标节点ID列表

  optional uint32 total = 5 [json_name = "total"]; // 目标节点总数

  optional uint32 success_count = 6 [json_name = "successCount"]; // 已成功数

  optional uint32 failed_count = 7 [json_name = "failedCount"]; // 已失败数

  optional string status = 8 [json_name = "status"]; // 状态(RUNNING/FINISHED)

  optional google.protobuf.Timestamp created_at = 30 [
    json_name = "createdAt",
    (google.api.field_behavior) = OUTPUT_ONLY
  ]; // 创建时间
}

message ListScriptBatchResponse {
  uint64 total = 1 [json_name = "total"]; // 总数
  repeated ScriptBatch items = 2 [json_name = "items"]; // 批次列表
}

message GetScriptBatchRequest {
  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = REQUIRED
  ]; // 批次ID
}

// 批次内单节点执行结果
message ScriptBatchItem {
  optional string request_id = 1 [json_name = "requestId"]; // 指令幂等键

  optional uint32 node_id = 2 [json_name = "nodeId"]; // 节点ID

  optional string agent_id = 3 [json_name = "agentId"]; // 机器标识

  optional string status = 4 [json_name = "status"]; // 状态(PENDING/SUCCESS/FAILED)

  optional string error = 5 [json_name = "error"]; // 失败原因

  optional int32 exit_code = 6 [json_name = "exitCode"]; // 退出码

  optional string duration = 7 [json_name = "duration"]; // 执行时长

  optional string output = 8 [json_name = "output"]; // 输出(截断至 4KB)

  optional google.protobuf.Timestamp finished_at = 9 [
    json_name = "finishedAt",
    (google.api.field_behavior) = OUTPUT_ONLY
  ]; // 终态时间
}

message ScriptBatchDetail {
  optional ScriptBatch batch = 1 [json_name = "batch"]; // 批次

  repeated ScriptBatchItem items = 2 [json_name = "items"]; // 逐节点结果
}
