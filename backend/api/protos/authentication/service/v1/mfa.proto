syntax = "proto3";

package authentication.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/empty.proto";
import "authentication/service/v1/authentication.proto";

// MfaService MFA(TOTP)二步验证:登录换证与自助绑定管理。
// 替换基座继承的多方法 MFA 样板(未实现、全仓无引用):平台只落 TOTP 一种,
// 免鉴权面收敛在 VerifyMFAChallenge 一处;验证通过直接回 LoginResponse,
// 前端复用登录成功流程(存 token/拉用户信息/跳转)。
service MfaService {
  // 凭密码授权签发的一次性挑战令牌(operation_id)+ TOTP 验证码换正式令牌
  rpc VerifyMFAChallenge (VerifyMFAChallengeRequest) returns (LoginResponse) {}
  // 发起绑定:生成 TOTP 密钥与 otpauth URI(落库未启用,须 Confirm 激活)
  rpc MfaSetupStart (MfaSetupStartRequest) returns (MfaSetupStartResponse) {}
  // 确认绑定:验证码校验通过后启用
  rpc MfaSetupConfirm (MfaSetupConfirmRequest) returns (google.protobuf.Empty) {}
  // 解绑:验证码校验通过后清除密钥并停用
  rpc MfaDisable (MfaDisableRequest) returns (google.protobuf.Empty) {}

  // 生成/重生成备份码(明文仅本次响应出现一次;登录时替代 TOTP 消费即失效)
  rpc MfaBackupCodesRegenerate (MfaBackupCodesRegenerateRequest) returns (MfaBackupCodesResponse) {}
}

// VerifyMFAChallengeRequest MFA 二步验证请求(免鉴权端点)
// 字段 json_name 对齐前端既有 hook 的调用字面量(operationId/totpCode)。
message VerifyMFAChallengeRequest {
  string operation_id = 1 [json_name = "operationId"]; // 密码授权返回的挑战令牌
  string totp_code = 2 [json_name = "totpCode"]; // TOTP 验证码(6 位)
  optional string client_id = 3 [json_name = "clientId"]; // 客户端标识(透传令牌载荷)
  optional string device_id = 4 [json_name = "deviceId"]; // 设备标识(透传令牌载荷)
}

// MfaSetupStartRequest 发起 MFA 绑定(鉴权端点,操作者=当前用户)
message MfaSetupStartRequest {
}

// MfaSetupStartResponse 绑定起点:Base32 密钥与 otpauth URI(扫码/手输)
message MfaSetupStartResponse {
  string secret = 1 [json_name = "secret"]; // Base32 密钥(手输兜底)
  string otpauth_uri = 2 [json_name = "otpauthUri"]; // otpauth:// URI(扫码)
}

// MfaSetupConfirmRequest 确认绑定:TOTP 验证码
message MfaSetupConfirmRequest {
  string code = 1 [json_name = "code"]; // TOTP 验证码(6 位)
}

// MfaDisableRequest 解绑:TOTP 验证码(防误触/劫持解绑)
message MfaDisableRequest {
  string code = 1 [json_name = "code"]; // TOTP 验证码(6 位)
}

// MfaBackupCodesRegenerateRequest 重生成备份码(鉴权,操作者=当前用户)
message MfaBackupCodesRegenerateRequest {
}

// MfaBackupCodesResponse 备份码明文(仅此一次;服务端只存哈希)
message MfaBackupCodesResponse {
  repeated string codes = 1 [json_name = "codes"]; // 备份码(xxxx-xxxx)
}
