syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "pagination/v1/pagination.proto";
import "ops/service/v1/distribution.proto";

// DistributionService 构建产物分发
service DistributionService {
  // 查询分发配置列表
  rpc List (pagination.PagingRequest) returns (ops.service.v1.ListDistributionResponse) {
    option (google.api.http) = {
      get: "/admin/v1/distributions"
    };
  }

  // 查询分发配置详情
  rpc Get (ops.service.v1.GetDistributionRequest) returns (ops.service.v1.Distribution) {
    option (google.api.http) = {
      get: "/admin/v1/distributions/{id}"
    };
  }

  // 创建分发配置
  rpc Create (ops.service.v1.CreateDistributionRequest) returns (ops.service.v1.Distribution) {
    option (google.api.http) = {
      post: "/admin/v1/distributions"
      body: "*"
    };
  }

  // 更新分发配置
  rpc Update (ops.service.v1.UpdateDistributionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/distributions/{id}"
      body: "*"
    };
  }

  // 删除分发配置
  rpc Delete (ops.service.v1.DeleteDistributionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/distributions/{id}"
    };
  }

  // 触发分发(异步执行)
  rpc Trigger (ops.service.v1.TriggerDistributionRequest) returns (ops.service.v1.TriggerDistributionResponse) {
    option (google.api.http) = {
      post: "/admin/v1/distributions/{id}/distributions:trigger"
      body: "*"
    };
  }

  // 查询分发执行记录
  rpc ListRecords (pagination.PagingRequest) returns (ops.service.v1.ListDistributionRecordResponse) {
    option (google.api.http) = {
      get: "/admin/v1/distribution-records"
    };
  }

  // 查询分发执行记录详情
  rpc GetRecord (ops.service.v1.GetDistributionRecordRequest) returns (ops.service.v1.DistributionRecord) {
    option (google.api.http) = {
      get: "/admin/v1/distribution-records/{id}"
    };
  }
}
