syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "pagination/v1/pagination.proto";
import "ops/service/v1/agent_node.proto";

// AgentNodeService 受管机器(agent 节点)管理
service AgentNodeService {
  // 查询节点列表
  rpc List (pagination.PagingRequest) returns (ops.service.v1.ListAgentNodeResponse) {
    option (google.api.http) = {
      get: "/admin/v1/agent-nodes"
    };
  }

  // 查询节点详情
  rpc Get (ops.service.v1.GetAgentNodeRequest) returns (ops.service.v1.AgentNode) {
    option (google.api.http) = {
      get: "/admin/v1/agent-nodes/{id}"
    };
  }

  // 更新节点(显示名/标签)
  rpc Update (ops.service.v1.UpdateAgentNodeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/agent-nodes/{id}"
      body: "*"
    };
  }

  // 删除节点记录
  rpc Delete (ops.service.v1.DeleteAgentNodeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/agent-nodes/{id}"
    };
  }

  // 吊销/恢复节点准入(id 走 body:触发类 POST 不带 path 参数)
  rpc Revoke (ops.service.v1.RevokeAgentNodeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/agent-nodes/revoke:send"
      body: "*"
    };
  }

  // 向节点下发指令(如 ping),返回幂等 request_id
  rpc SendCommand (ops.service.v1.SendCommandRequest) returns (ops.service.v1.SendCommandResponse) {
    option (google.api.http) = {
      post: "/admin/v1/agent-nodes/{id}/commands:send"
      body: "*"
    };
  }

  // 查询节点心跳指标历史
  rpc GetMetrics (ops.service.v1.GetNodeMetricsHistoryRequest) returns (ops.service.v1.GetNodeMetricsHistoryResponse) {
    option (google.api.http) = {
      get: "/admin/v1/agent-nodes/{id}/metrics"
    };
  }

  // 签发 agent 升级包上传预签名 URL(浏览器直传)
  rpc GetUpgradeUploadUrl (ops.service.v1.GetAgentUpgradeUploadUrlRequest) returns (ops.service.v1.GetAgentUpgradeUploadUrlResponse) {
    option (google.api.http) = {
      post: "/admin/v1/agent-nodes/upgrade-upload-url:resolve"
      body: "*"
    };
  }

  // 远程升级 agent(下发自替换指令)
  rpc Upgrade (ops.service.v1.UpgradeAgentRequest) returns (ops.service.v1.UpgradeAgentResponse) {
    option (google.api.http) = {
      post: "/admin/v1/agent-nodes/upgrade:send"
      body: "*"
    };
  }
}
