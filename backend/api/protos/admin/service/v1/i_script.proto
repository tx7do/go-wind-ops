syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "pagination/v1/pagination.proto";
import "ops/service/v1/script.proto";

// ScriptService 运维脚本管理
service ScriptService {
  // 查询脚本列表
  rpc List (pagination.PagingRequest) returns (ops.service.v1.ListScriptResponse) {
    option (google.api.http) = {
      get: "/admin/v1/scripts"
    };
  }

  // 查询脚本详情
  rpc Get (ops.service.v1.GetScriptRequest) returns (ops.service.v1.Script) {
    option (google.api.http) = {
      get: "/admin/v1/scripts/{id}"
    };
  }

  // 创建脚本
  rpc Create (ops.service.v1.CreateScriptRequest) returns (ops.service.v1.Script) {
    option (google.api.http) = {
      post: "/admin/v1/scripts"
      body: "*"
    };
  }

  // 更新脚本
  rpc Update (ops.service.v1.UpdateScriptRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/scripts/{id}"
      body: "*"
    };
  }

  // 删除脚本
  rpc Delete (ops.service.v1.DeleteScriptRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/scripts/{id}"
    };
  }

  // 在目标节点执行脚本,返回幂等 request_id
  rpc Execute (ops.service.v1.ExecuteScriptRequest) returns (ops.service.v1.ExecuteScriptResponse) {
    option (google.api.http) = {
      post: "/admin/v1/scripts/{id}/executions:send"
      body: "*"
    };
  }
}
