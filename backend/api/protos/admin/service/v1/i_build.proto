syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "pagination/v1/pagination.proto";
import "ops/service/v1/build.proto";

// BuildService 构建配置管理与触发
service BuildService {
  // 查询构建配置列表
  rpc List (pagination.PagingRequest) returns (ops.service.v1.ListBuildResponse) {
    option (google.api.http) = {
      get: "/admin/v1/builds"
    };
  }

  // 查询构建配置详情
  rpc Get (ops.service.v1.GetBuildRequest) returns (ops.service.v1.Build) {
    option (google.api.http) = {
      get: "/admin/v1/builds/{id}"
    };
  }

  // 创建构建配置
  rpc Create (ops.service.v1.CreateBuildRequest) returns (ops.service.v1.Build) {
    option (google.api.http) = {
      post: "/admin/v1/builds"
      body: "*"
    };
  }

  // 更新构建配置
  rpc Update (ops.service.v1.UpdateBuildRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/builds/{id}"
      body: "*"
    };
  }

  // 删除构建配置
  rpc Delete (ops.service.v1.DeleteBuildRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/builds/{id}"
    };
  }

  // 触发构建(异步执行)
  rpc Trigger (ops.service.v1.TriggerBuildRequest) returns (ops.service.v1.TriggerBuildResponse) {
    option (google.api.http) = {
      post: "/admin/v1/builds/{id}/builds:trigger"
      body: "*"
    };
  }
}
