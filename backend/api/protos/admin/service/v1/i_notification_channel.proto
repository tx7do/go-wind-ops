syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "pagination/v1/pagination.proto";
import "ops/service/v1/notification_channel.proto";

service NotificationChannelService {
  rpc List (pagination.PagingRequest) returns (ops.service.v1.ListNotificationChannelResponse) {
    option (google.api.http) = { get: "/admin/v1/notification-channels" };
  }
  rpc Get (ops.service.v1.GetNotificationChannelRequest) returns (ops.service.v1.NotificationChannel) {
    option (google.api.http) = { get: "/admin/v1/notification-channels/{id}" };
  }
  rpc Create (ops.service.v1.CreateNotificationChannelRequest) returns (ops.service.v1.NotificationChannel) {
    option (google.api.http) = { post: "/admin/v1/notification-channels" body: "*" };
  }
  rpc Update (ops.service.v1.UpdateNotificationChannelRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { put: "/admin/v1/notification-channels/{id}" body: "*" };
  }
  rpc Delete (ops.service.v1.DeleteNotificationChannelRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/admin/v1/notification-channels/{id}" };
  }
}
