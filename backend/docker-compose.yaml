  redis:
    image: docker.io/bitnami/redis:latest
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-tier
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev_only_change_me}
      - REDIS_AOF_ENABLED=no
      - REDIS_IO_THREADS_DO_READS=yes
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL,CONFIG
#    volumes:
#      - ${APP_ROOT:-/root/app}/redis/data:/bitnami/redis/data

  # EMQX:agent 信令 MQTT broker(1883 TCP / 8883 TLS / 18083 管理控制台,账密 admin/public)
  # 安全(broker 级认证+授权,回调 core-service 的 webhook,见 mqtt_auth_server.go):
  #   认证 /api/v1/mqtt/auth —— core 账号比对配置;agent 以 agentId+token 校验(TOFU 首连注册)
  #   授权 /api/v1/mqtt/acl —— core 全权 ops/;agent 仅限 ops/agent/{自身用户名}/#;未命中拒绝
  # 注意:BODY 模板里的 $$ 是 compose 转义,原样 ${username} 才能到达 EMQX。
  emqx:
    image: docker.io/emqx/emqx:latest
    container_name: emqx
    hostname: emqx
    restart: always
    ports:
      - "1883:1883"
      - "8883:8883"
      - "18083:18083"
    networks:
      - app-tier
    environment:
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=public
      # ── 认证:HTTP 回调 core webhook ──
      - EMQX_AUTHENTICATION__1__ENABLE=true
      - EMQX_AUTHENTICATION__1__MECHANISM=password_based
      - EMQX_AUTHENTICATION__1__BACKEND=http
      - EMQX_AUTHENTICATION__1__METHOD=post
      - EMQX_AUTHENTICATION__1__URL=http://core-service:9500/api/v1/mqtt/auth
      - EMQX_AUTHENTICATION__1__BODY={"username":"$${username}","password":"$${password}","clientid":"$${clientid}"}
      # ── 授权:HTTP 回调 core webhook ──
      - EMQX_AUTHORIZATION__NO_MATCH=deny
      - EMQX_AUTHORIZATION__SOURCES__1__ENABLE=true
      - EMQX_AUTHORIZATION__SOURCES__1__TYPE=http
      - EMQX_AUTHORIZATION__SOURCES__1__METHOD=post
      - EMQX_AUTHORIZATION__SOURCES__1__URL=http://core-service:9500/api/v1/mqtt/acl
      - EMQX_AUTHORIZATION__SOURCES__1__BODY={"username":"$${username}","topic":"$${topic}","action":"$${action}","clientid":"$${clientid}"}

  minio:
    image: docker.io/minio/minio:latest
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - app-tier
    environment:
      - MINIO_ROOT_USER=root
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-dev_only_change_me}
      - MINIO_DEFAULT_BUCKETS=images
      - MINIO_FORCE_NEW_KEYS=yes
      - BITNAMI_DEBUG=true
#    volumes:
#      - ${APP_ROOT:-/root/app}/minio/data:/data
    command: server /data --console-address ':9001'

#  consul:
#    image: docker.io/bitnami/consul:latest
#    restart: always
#    ports:
#      - '8300:8300'
#      - '8301:8301'
#      - '8301:8301/udp'
#      - '8500:8500'
#      - '8600:8600'
#      - '8600:8600/udp'
#    networks:
#      - app-tier
#    environment:
#      - CONSUL_BIND_INTERFACE='eth0'
#      - CONSUL_AGENT_MODE=server
#      - CONSUL_ENABLE_UI=true
#      - CONSUL_BOOTSTRAP_EXPECT=1
#      - CONSUL_CLIENT_LAN_ADDRESS=0.0.0.0
#      - CONSUL_BIND_ADDR=0.0.0.0
#      - CONSUL_DISABLE_KEYRING_FILE=true
#      - CONSUL_NODE_NAME=consul

  etcd:
    image: quay.io/coreos/etcd:v3.6.8
    restart: always
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      - app-tier
    environment:
      - ETCDCTL_API=3
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://127.0.0.1:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://127.0.0.1:2380
      - ETCD_INITIAL_CLUSTER=default=http://127.0.0.1:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster-token
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_NAME=default

  jaeger:
    image: docker.io/jaegertracing/all-in-one:latest
    restart: always
    ports:
      - "6831:6831/udp"
      - "5778:5778"
      - "4317:4317"
      - "4318:4318"
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
      - "14269:14269"
    networks:
      - app-tier
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true

  admin-service:
    image: go-wind-ops/admin-service:1.0.0
    restart: always
    pull_policy: never
    networks:
      - app-tier
    ports:
      - "9700:9700"
      - "9701:9701"
    depends_on:
      - postgres
      - redis
      - minio
      - etcd
      - jaeger
    environment:
      - TZ=Asia/Shanghai
    build:
      context: ./  # 指定 Dockerfile 所在的上下文路径
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: admin
        APP_VERSION: 1.0.0

  front-service:
    image: go-wind-ops/front-service:1.0.0
    pull_policy: never
    restart: always
    networks:
      - app-tier
    ports:
      - "9800:9800"
      - "9801:9801"
    depends_on:
      - postgres
      - redis
      - minio
      - etcd
      - jaeger
    environment:
      - TZ=Asia/Shanghai
    build:
      context: ./  # 指定 Dockerfile 所在的上下文路径
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: front
        APP_VERSION: 1.0.0

  agent-service:
    image: go-wind-ops/agent-service:1.0.0
    pull_policy: never
    restart: always
    networks:
      - app-tier
    # agent 只需出站 MQTT/HTTP,不暴露入站端口;host 网络便于采集宿主机指标
    # (生产部署在受管机器上,不走本 compose,见 AGENTS.md)
    depends_on:
      - emqx
    environment:
      - TZ=Asia/Shanghai
    build:
      context: ./  # 指定 Dockerfile 所在的上下文路径
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: agent
        APP_VERSION: 1.0.0

  core-service:
    image: go-wind-ops/core-service:1.0.0
    pull_policy: never
    restart: always
    networks:
      - app-tier
    depends_on:
      - postgres
      - redis
      - minio
      - etcd
      - jaeger
    environment:
      - TZ=Asia/Shanghai
    build:
      context: ./  # 指定 Dockerfile 所在的上下文路径
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: core
        APP_VERSION: 1.0.0

