            description: 更新 - 请求
        permission.service.v1.UpdatePermissionRequest:
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
                data:
                    $ref: '#/components/schemas/permission.service.v1.Permission'
                updateMask:
                    example: id,realname,username
                    type: string
                    description: 要更新的字段列表
                    format: field-mask
                allowMissing:
                    type: boolean
                    description: 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。
            description: 更新 - 请求
        permission.service.v1.UpdateRoleRequest:
            type: object
            properties:
                id:
                    type: integer
