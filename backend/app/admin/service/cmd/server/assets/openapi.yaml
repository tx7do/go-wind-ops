        permission.service.v1.PolicyEvaluationLog:
            type: object
            properties:
                id:
                    type: integer
                    description: 策略评估日志ID
                    format: uint32
                tenantId:
                    type: integer
                    description: 租户ID
                    format: uint32
                userId:
                    type: integer
                    description: 操作者用户ID
                    format: uint32
                membershipId:
                    type: integer
                    description: 成员身份ID
                    format: uint32
                permissionId:
                    type: integer
                    description: 权限点ID
                    format: uint32
                policyId:
                    type: integer
                    description: 策略ID（可能无策略）
                    format: uint32
                requestPath:
                    type: string
                    description: 请求API路径
                requestMethod:
                    type: string
                    description: 请求HTTP方法
                result:
                    type: boolean
                    description: 是否通过
                effectDetails:
                    type: string
                    description: 评估详情/拒绝原因
                scopeSql:
                    type: string
                    description: 生成的SQL条件
                ipAddress:
                    type: string
                    description: 操作者IP地址
                traceId:
                    type: string
                    description: 全局链路追踪ID（符合W3C TraceContext标准）
                evaluationContext:
                    type: string
                    description: 决策上下文快照(如用户属性、环境属性)
                logHash:
                    type: string
                    description: 日志内容哈希（SHA256，十六进制字符串）
                signature:
                    type: string
                    description: 日志数字签名（ECDSA，签名内容：tenant_id+user_id+created_at+log_hash）
                    format: bytes
                createdAt:
                    type: string
                    description: 日志创建时间
                    format: date-time
            description: 策略评估日志
        permission.service.v1.Role:
            type: object
            properties:
                id:
                    type: integer
                    description: 角色ID
                    format: uint32
                name:
                    type: string
                    description: 角色名称
                code:
                    example: platform:admin, tenant:admin1
                    type: string
                    description: 角色标识码
                sortOrder:
                    type: integer
                    description: 排序顺序，值越小越靠前
                    format: uint32
                status:
                    enum:
                        - OFF
                        - ON
                    type: string
                    description: 状态
                    format: enum
                description:
                    type: string
                    description: 描述
                isProtected:
                    type: boolean
                    description: 受保护角色，仅平台管理员可修改
                type:
                    enum:
                        - SYSTEM
                        - TEMPLATE
                        - TENANT
                    type: string
                    description: 角色类型
                    format: enum
                permissions:
                    type: array
                    items:
                        type: integer
                        format: uint32
                    description: 绑定的权限点ID列表
                tenantId:
                    type: integer
                    description: 租户ID，0代表系统全局角色
                    format: uint32
                tenantName:
                    type: string
                    description: 租户名称
                createdBy:
                    type: integer
                    description: 创建者用户ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者用户ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
