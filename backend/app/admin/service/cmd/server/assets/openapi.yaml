        task.service.v1.ControlTaskRequest:
            type: object
            properties:
                controlType:
                    enum:
                        - Start
                        - Stop
                        - Restart
                    type: string
                    description: 控制类型
                    format: enum
                typeName:
                    type: string
                    description: 任务执行类型名，例如 "send_email"、"generate_report" 等，用于区分不同类型的任务
            description: 控制调度任务 - 请求
        task.service.v1.CreateTaskRequest:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/task.service.v1.Task'
            description: 创建调度任务 - 请求
        task.service.v1.ListTaskExecutionsResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/task.service.v1.TaskExecution'
                total:
                    type: string
            description: 查询任务执行记录 - 回应
        task.service.v1.ListTaskResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/task.service.v1.Task'
                total:
                    type: string
            description: 查询调度任务列表 - 回应
        task.service.v1.ListTaskTypeNameResponse:
            type: object
            properties:
                typeNames:
                    type: array
                    items:
                        type: string
                    description: 类型名称列表
            description: 任务类型名称列表 - 回应
        task.service.v1.RestartAllTaskResponse:
            type: object
            properties:
                count:
                    type: integer
                    format: int32
            description: 重启调度任务 - 回应
        task.service.v1.Task:
            type: object
            properties:
                id:
                    type: integer
                    description: 任务ID
                    format: uint32
                type:
                    enum:
                        - PERIODIC
                        - DELAY
                        - WAIT_RESULT
                    type: string
                    description: 任务类型
                    format: enum
                typeName:
                    type: string
                    description: 任务执行类型名，例如 "send_email"、"generate_report" 等，用于区分不同类型的任务
                taskPayload:
                    type: string
                    description: 任务数据，以 JSON 格式存储，方便存储不同类型和数量的参数
                cronSpec:
                    type: string
                    description: cron表达式，用于定义任务的调度时间
                taskOptions:
                    $ref: '#/components/schemas/task.service.v1.TaskOption'
                enable:
                    type: boolean
                    description: 启用/禁用任务
                remark:
                    type: string
                    description: 备注
                tenantId:
                    type: integer
                    description: 租户ID，0代表系统全局角色
                    format: uint32
                createdBy:
                    type: integer
                    description: 创建者用户ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者用户ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: 调度任务
        task.service.v1.TaskExecution:
            type: object
            properties:
                id:
                    type: string
                    description: 任务实例ID
                typeName:
                    type: string
                    description: 任务执行类型名
                state:
                    type: string
                    description: 实例状态：active/pending/scheduled/retry/archived/completed
                payload:
                    type: string
                    description: 任务载荷（JSON）
                retried:
                    type: integer
                    description: 已重试次数
                    format: uint32
                lastError:
                    type: string
                    description: 最近一次执行错误
                lastFailedAt:
                    type: string
                    description: 最近失败时间
                    format: date-time
                completedAt:
                    type: string
                    description: 完成时间
                    format: date-time
                nextProcessAt:
                    type: string
                    description: 下次处理时间
                    format: date-time
            description: 任务执行记录（单次任务实例；来源 asynq Inspector，深度受 retention 窗口约束）
        task.service.v1.TaskOption:
            type: object
            properties:
                maxRetry:
                    type: integer
                    description: 任务最多可以重试的次数
                    format: uint32
                timeout:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 任务超时时间
                deadline:
                    type: string
                    description: 任务截止时间
                    format: date-time
                processIn:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 任务延迟处理时间
                processAt:
                    type: string
                    description: 任务执行时间点
                    format: date-time
                uniqueTTL:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 任务唯一锁定时间
                retention:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 任务结果保留时间
                group:
                    type: string
                    description: 任务分组
                taskID:
                    type: string
                    description: 任务唯一标识ID
            description: 任务选项
        task.service.v1.UpdateTaskRequest:
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
                data:
                    $ref: '#/components/schemas/task.service.v1.Task'
                updateMask:
                    example: id,realname,username
                    type: string
                    description: 要更新的字段列表
                    format: field-mask
                allowMissing:
                    type: boolean
                    description: 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。
            description: 更新调度任务 - 请求
    responses:
        default:
            description: default kratos response
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/KratosStatus'
    securitySchemes:
        OAuth2PasswordBearer:
            type: oauth2
            flows:
                password:
                    tokenUrl: /admin/v1/login
                    refreshUrl: /admin/v1/refresh-token
                    scopes: {}
security:
    - OAuth2PasswordBearer: []
