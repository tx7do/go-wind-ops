server:
  grpc:
    addr: "0.0.0.0:0"
    timeout: 10s
    middleware:
      enable_logging: true
      enable_recovery: true
      enable_tracing: true
      enable_validate: true
      enable_circuit_breaker: true
      enable_metadata: true

  # 最小 REST:仅用于 EMQX broker 认证 webhook(/api/v1/mqtt/auth)
  # 及未来的运维端点;无中间件(认证由 EMQX 回调语义保证)
  rest:
    addr: "0.0.0.0:9500"

  asynq:
    # db2 专库：db1 的 asynq:{default} 队列被本机多个项目共用，外来 asynq
    # worker 会抢走本项目的任务（handler not found → 重试归档，任务丢失）。
    uri: "redis://:*Abcd123456@redis:6379/2"
    enable_gracefully_shutdown: true
    shutdown_timeout: 3s
    codec: "json"
  mqtt:
    endpoint: "tcp://127.0.0.1:1883"
    codec: "json"
    # core 自身的 MQTT 账号:EMQX HTTP 认证回调 /api/v1/mqtt/auth 时,
    # username==core 按这对凭证比对(不出现在 agent 表)。口令经
    # MQTT_CORE_PASSWORD 由 pkg/configenv 在装配期注入(持有此口令即可向
    # 全部 agent 下发指令,生产必须设置强口令;配置占位符不读 env,
    # ${...} 的 default 仅作 dev 回落)。
    username: "core"
    password: "${MQTT_CORE_PASSWORD:core-pass}"
    clean_session: false
    auto_reconnect: true
    resume_subs: true
    connect_retry_interval: 5s
    max_reconnect_interval: 60s
    # TLS(指向 EMQX 8883 时启用;dev 自签证书可 insecure_skip_verify)
    # endpoint: "ssl://127.0.0.1:8883"
    # tls:
    #   insecure_skip_verify: true
    #   file:
    #     ca_path: "/etc/go-wind-ops/emqx-ca.pem"
