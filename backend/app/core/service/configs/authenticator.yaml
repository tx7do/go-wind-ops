authenticator:
  admin:
    method: "HS256" # 对称加密算法，支持 HS256, HS384, HS512
    key: "${jwt_signing_key:dev_only_change_me_in_prod}" # 管理端 JWT 签名密钥，生产必须经 jwt_signing_key 覆盖（占位符不读 env，覆盖在 data.NewAuthenticator 内完成）
    access_token_expires: 5400s      # 1.5 小时
    refresh_token_expires: 43200s       # 12 小时

  app:
    method: "HS256" # 对称加密算法，支持 HS256, HS384, HS512
    # C 端签名密钥独立于管理端（jwt_signing_key_app），避免一端泄露两端全失守；
    # 生产必须单独覆盖。
    key: "${jwt_signing_key_app:dev_app_only_change_me}"
    access_token_expires: 900s        # 移动/客户端短期 token 15分钟
    refresh_token_expires: 0s        # 0s 表示不颁发/禁用 refresh token

